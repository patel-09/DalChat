spring.application.name=backend

# Load private settings (like the database password) from a file Git ignores
spring.config.import=optional:file:./application-secrets.properties

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/dalchat
spring.datasource.username=dalchat_app

# Tables are created by Flyway migrations, never automatically by Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=8080